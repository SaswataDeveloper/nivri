<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figma</title>
    <link rel="stylesheet" href="css/style.css">

    <!-- ---------------google font------------------ -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">  

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>

    <!-- ========================= header ============================ -->

    <section class="header">

        <div class="container">
            <div class="nav">
                <div class="logo">
                    <img src="img/logo.png">
                </div>
                <div class="navlink">
                    <ul class="navlinks">
                        <li>Home</li>
                        <li>About</li>
                        <li>Service</li>
                        <li>Price</li>
                        <li>Testimonial</li>
                    </ul>
                </div>

                <div class="contact">
                    <button class="nav-btn">Contact</button>
                </div>

                <div class="mobile-tab">
                    <i class="fa-solid fa-bars"></i>
                </div>
            </div>
        </div>

    </section>



    <!-- ========================== header ============================ -->


    <!-- =============================== hero section ========================= -->


    <div class="hero">
        <div class="container">
            <div class="hero-sec">

                <div class="left-content">
                    <h1>Great software is built with <span style="color: var(--primary-color);">amazing developers</span></h1>
                    <p>We help build and manage a team of world-class developers to bring your vision to life</p>
                    <button class="hero-btn">Get Started</button>
                </div>

                <div class="right-imgage">
                    <img src="img/hero.png" alt="hero image">
                </div>

            </div>
        </div>
    </div>








    <!-- =============================== hero section ========================= -->

<script src="js/script.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/js/all.min.js" integrity="sha512-2+f4MxT8KwN4tUzw6/hv9kxKiix603S9kmBcix+0y0dBhd6zdaPOV1Thf1DM886pFZG+cAtmshBi8UBpo6m3JA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</body>

</html>
